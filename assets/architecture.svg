<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Daymark Agent Toolkit — Shared Core, Multiple Interfaces Architecture</title>
  <desc id="desc">Diagram showing three user interfaces (Local CLI and AI Agents over MCP STDIO, Standalone React Web Dashboard over loopback HTTP API with CSRF, and Claude Web over Cloudflare Tunnel HTTPS and Streamable HTTP /mcp) sharing a single @daymark/core application/domain layer and local SQLite database.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="100%" stop-color="#0F1B2E" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#102A43" />
      <stop offset="100%" stop-color="#133352" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0C2438" />
      <stop offset="100%" stop-color="#0F2D46" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22D3EE" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8" />
    </marker>
    <style>
      .font-sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'DejaVu Sans Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="640" rx="18" fill="url(#bgGrad)" stroke="#1E3250" stroke-width="2" />

  <!-- Subtle background grid -->
  <g stroke="#16263F" stroke-width="1" opacity="0.55">
    <line x1="0" y1="160" x2="1120" y2="160" />
    <line x1="0" y1="320" x2="1120" y2="320" />
    <line x1="0" y1="480" x2="1120" y2="480" />
    <line x1="280" y1="0" x2="280" y2="640" />
    <line x1="560" y1="0" x2="560" y2="640" />
    <line x1="840" y1="0" x2="840" y2="640" />
  </g>

  <!-- Header -->
  <text x="560" y="42" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700" class="font-sans">
    Daymark Agent Toolkit — Shared Core, Multiple Interfaces
  </text>
  <text x="560" y="66" text-anchor="middle" fill="#94A3B8" font-size="13" class="font-sans">
    One deterministic TypeScript core &amp; SQLite store shared across Local AI Agents, Browser Dashboard, and Claude Web
  </text>

  <!-- TOP LAYER: 3 INTERFACES -->
  <!-- Column 1: Local AI Agents + CLI -->
  <g transform="translate(42, 92)">
    <rect width="320" height="158" rx="12" fill="#111C2E" stroke="#22D3EE" stroke-width="1.5" />
    <rect x="14" y="14" width="142" height="22" rx="11" fill="#0B3B49" stroke="#22D3EE" stroke-width="1" />
    <text x="85" y="29" text-anchor="middle" fill="#22D3EE" font-size="11" font-weight="700" class="font-sans">INTERFACE 1 · LOCAL</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="16" font-weight="700" class="font-sans">Local AI Agents &amp; CLI</text>
    <text x="16" y="79" fill="#94A3B8" font-size="12" class="font-sans">Claude Code · Codex · Cursor · Antigravity · OpenCode</text>
    <rect x="16" y="94" width="288" height="48" rx="8" fill="#0A1322" stroke="#233554" />
    <text x="28" y="114" fill="#38BDF8" font-size="12" font-weight="600" class="font-mono">daymark-mcp (STDIO)</text>
    <text x="28" y="132" fill="#94A3B8" font-size="10.5" class="font-mono">daymark &lt;cmd&gt; · 16 MCP tools + 3 Skills</text>
  </g>

  <!-- Column 2: Standalone Web Dashboard -->
  <g transform="translate(400, 92)">
    <rect width="320" height="158" rx="12" fill="#111C2E" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="14" y="14" width="166" height="22" rx="11" fill="#102E4A" stroke="#38BDF8" stroke-width="1" />
    <text x="97" y="29" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700" class="font-sans">INTERFACE 2 · BROWSER UI</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="16" font-weight="700" class="font-sans">Standalone Web Dashboard</text>
    <text x="16" y="79" fill="#94A3B8" font-size="12" class="font-sans">React 19 + TypeScript SPA (apps/web)</text>
    <rect x="16" y="94" width="288" height="48" rx="8" fill="#0A1322" stroke="#233554" />
    <text x="28" y="114" fill="#38BDF8" font-size="12" font-weight="600" class="font-mono">http://127.0.0.1:3456 (/api/*)</text>
    <text x="28" y="132" fill="#94A3B8" font-size="10.5" class="font-mono">Origin/Host · HMAC CSRF · No browser DB</text>
  </g>

  <!-- Column 3: Claude Web Remote MCP -->
  <g transform="translate(758, 92)">
    <rect width="320" height="158" rx="12" fill="#111C2E" stroke="#34D399" stroke-width="1.5" />
    <rect x="14" y="14" width="154" height="22" rx="11" fill="#0D3B32" stroke="#34D399" stroke-width="1" />
    <text x="91" y="29" text-anchor="middle" fill="#34D399" font-size="11" font-weight="700" class="font-sans">INTERFACE 3 · REMOTE</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="16" font-weight="700" class="font-sans">Claude Web &amp; Remote MCP</text>
    <text x="16" y="79" fill="#94A3B8" font-size="12" class="font-sans">claude.ai Connectors → HTTPS Cloudflare Tunnel</text>
    <rect x="16" y="94" width="288" height="48" rx="8" fill="#0A1322" stroke="#233554" />
    <text x="28" y="114" fill="#34D399" font-size="12" font-weight="600" class="font-mono">Streamable HTTP POST/GET /mcp</text>
    <text x="28" y="132" fill="#94A3B8" font-size="10.5" class="font-mono">Bearer/OAuth · Rate Limit · Redacted</text>
  </g>

  <!-- Connectors Top -> Core -->
  <line x1="202" y1="250" x2="202" y2="294" stroke="#22D3EE" stroke-width="2.2" marker-end="url(#arrowCyan)" />
  <line x1="560" y1="250" x2="560" y2="294" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrowBlue)" />
  <line x1="918" y1="250" x2="918" y2="294" stroke="#22D3EE" stroke-width="2.2" marker-end="url(#arrowCyan)" />

  <!-- MIDDLE LAYER: SHARED CORE (@daymark/core) -->
  <g transform="translate(42, 302)">
    <rect width="1036" height="170" rx="14" fill="url(#coreGrad)" stroke="#22D3EE" stroke-width="2" />
    <text x="24" y="32" fill="#22D3EE" font-size="12" font-weight="700" letter-spacing="0.8" class="font-mono">@daymark/core · SINGLE SOURCE OF BUSINESS LOGIC</text>
    <text x="1012" y="32" text-anchor="end" fill="#94A3B8" font-size="12" class="font-sans">Zero LLM calls · Zero filesystem dependencies</text>

    <!-- Application Box -->
    <rect x="24" y="48" width="320" height="104" rx="10" fill="#0A1526" stroke="#28476E" />
    <text x="40" y="72" fill="#F8FAFC" font-size="14" font-weight="700" class="font-sans">Application &amp; Policy Layer</text>
    <text x="40" y="93" fill="#38BDF8" font-size="12" class="font-mono">createGuardedDaymarkService()</text>
    <text x="40" y="113" fill="#94A3B8" font-size="11.5" class="font-sans">• Permission scopes: read | write | backup</text>
    <text x="40" y="131" fill="#94A3B8" font-size="11.5" class="font-sans">• ExecutionContext &amp; local path redaction</text>

    <!-- Domain Box -->
    <rect x="358" y="48" width="320" height="104" rx="10" fill="#0A1526" stroke="#28476E" />
    <text x="374" y="72" fill="#F8FAFC" font-size="14" font-weight="700" class="font-sans">Pure Domain Core</text>
    <text x="374" y="93" fill="#22D3EE" font-size="12" class="font-mono">planner · reviews · rules · time</text>
    <text x="374" y="113" fill="#94A3B8" font-size="11.5" class="font-sans">• Deterministic minute-budget daily ranking</text>
    <text x="374" y="131" fill="#94A3B8" font-size="11.5" class="font-sans">• DST-safe IANA dates &amp; factual gap reporting</text>

    <!-- Storage Port Box -->
    <rect x="692" y="48" width="320" height="104" rx="10" fill="#0A1526" stroke="#28476E" />
    <text x="708" y="72" fill="#F8FAFC" font-size="14" font-weight="700" class="font-sans">Storage Abstraction Ports</text>
    <text x="708" y="93" fill="#34D399" font-size="12" class="font-mono">DaymarkStore · AsyncDaymarkStore</text>
    <text x="708" y="113" fill="#94A3B8" font-size="11.5" class="font-sans">• Transactional repository interfaces</text>
    <text x="708" y="131" fill="#94A3B8" font-size="11.5" class="font-sans">• TenantContext-ready for future D1 / Turso</text>
  </g>

  <!-- Connector Core -> Storage -->
  <line x1="560" y1="472" x2="560" y2="514" stroke="#22D3EE" stroke-width="2.2" marker-end="url(#arrowCyan)" />

  <!-- BOTTOM LAYER: SQLITE STORAGE -->
  <g transform="translate(42, 522)">
    <rect width="1036" height="90" rx="12" fill="url(#dbGrad)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="24" y="30" fill="#F8FAFC" font-size="15" font-weight="700" class="font-sans">Local Storage Adapter (@daymark/storage-sqlite)</text>
    <text x="1012" y="30" text-anchor="end" fill="#34D399" font-size="12" font-weight="600" class="font-mono">daymark.sqlite (WAL · 0600 POSIX)</text>
    <text x="24" y="54" fill="#CBD5E1" font-size="12.5" class="font-sans">
      better-sqlite3 + Drizzle ORM · Forward-only migrations · Transactional partial unique index (max 1 active focus session) · Idempotency keys
    </text>
    <text x="24" y="74" fill="#94A3B8" font-size="11.5" class="font-mono">
      Shared state across CLI, STDIO MCP, Web Dashboard, &amp; Remote MCP — zero direct SQLite access from browser or remote clients
    </text>
  </g>
</svg>
